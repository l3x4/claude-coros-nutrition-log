<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Logbook: one column. Day first, then the week, intake vs burn, the weight trend, settings. */
  --bg: #f2f4f1;
  --panel: #ffffff;
  --ink: #1b2422;
  --muted: #5b6663;
  --line: #dce1dc;
  --accent: #1f5f8b;
  --on-accent: #ffffff;
  --track: #e7ebe6;
  --ok: #2e7d4f;
  --warn: #a8661a;
  --bad: #b42318;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* Intake vs burn chart: categorical slots 1–2, validated against --panel in both modes. */
  --s-eat: #2a78d6;
  --s-burn: #eb6834;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --panel: #1a201f; --ink: #e5eae7; --muted: #9ba6a2; --line: #2c3533;
    --accent: #72aad6; --on-accent: #0c1822; --track: #262e2c;
    --ok: #62b986; --warn: #dba358; --bad: #ef7b70;
    --s-eat: #3987e5; --s-burn: #d95926;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --panel: #1a201f; --ink: #e5eae7; --muted: #9ba6a2; --line: #2c3533;
  --accent: #72aad6; --on-accent: #0c1822; --track: #262e2c;
  --ok: #62b986; --warn: #dba358; --bad: #ef7b70;
  --s-eat: #3987e5; --s-burn: #d95926;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 600 26px/1.15 var(--font-display); letter-spacing: 0.005em; }
h2 { font: 600 18px/1.2 var(--font-display); }
h3 { font: 600 15px/1.2 var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 14px; min-width: 0; }

.top { display: grid; gap: 10px; }
.top-row { display: flex; align-items: flex-start; gap: 12px; }
.top-row > div:first-child { flex: 1 1 auto; min-width: 0; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.lang button { border: 0; background: var(--panel); padding: 5px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.progress { display: grid; gap: 6px; }
.status { font-size: 13px; color: var(--muted); }
.status:empty { display: none; }
.status.warn { color: var(--warn); }
.status.bad { color: var(--bad); }
.sub.warn { color: var(--warn); }
.sub.ok { color: var(--ok); }
.onb { border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }

.track { position: relative; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: var(--accent); }
.fill.ok { background: var(--ok); }
.fill.over { background: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width 0.25s ease; } }

.day-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-nav h2 { flex: 1 1 auto; min-width: 0; text-align: center; }
button { font: inherit; color: inherit; cursor: pointer; }
.icon { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; line-height: 1; }
.btn { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 11px; font-size: 13px; }
.chip .num { color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] .num { color: inherit; opacity: 0.85; }

.kcal { display: grid; gap: 2px; }
.kcal-big { font: 600 34px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kcal-of { font-size: 16px; color: var(--muted); }
.left { font-size: 14px; color: var(--ok); }
.left.over { color: var(--warn); }

.burn { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.burn-line { font-size: 15px; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; }
.burn-line b { font: 600 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.burn .actions { margin-top: 4px; }
td.partial { color: var(--muted); }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.bar-l { color: var(--muted); }
.bar-v { white-space: nowrap; }

.weight { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: end; }
.weight label { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 60px; }

.meals { display: grid; }
.meal { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; }
.meal-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-weight: 600; }
.meal-time { color: var(--muted); font-weight: 400; font-size: 13px; }
.tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.meal-desc { font-size: 14px; overflow-wrap: anywhere; }
.meal-note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.meal-macros { font-size: 12px; color: var(--muted); }
.meal-side { display: grid; justify-items: end; align-content: start; gap: 6px; }
.meal-kcal { font: 600 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meal-actions { display: flex; gap: 4px; }
.link { background: none; border: 0; padding: 2px 4px; font-size: 12px; color: var(--accent); }
.link.danger { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

details > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
details[open] > summary { margin-bottom: 10px; }
.meal-form { display: grid; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.set-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.set-grid .wide { grid-column: 1 / -1; }
.set-block { display: grid; gap: 8px; padding-top: 4px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.tile-k { font-size: 12px; color: var(--muted); }
.tile-v { font: 600 20px/1.2 var(--font-display); white-space: nowrap; }
.tile-s { font-size: 12px; color: var(--muted); }
.tile-v.good { color: var(--ok); }
.tile-v.bad { color: var(--warn); }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.r, th.r { text-align: right; }
#weekBody tr { cursor: pointer; }
tbody tr.sel td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); }
.dot.over { background: var(--warn); }
.dot.low { border: 1.5px solid var(--muted); }
.legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 11px var(--font-mono); }
.chart .goal { stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .goal-t { fill: var(--ok); font: 11px var(--font-mono); }
.chart .plan { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .avg { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
.chart .pt.last { fill: var(--accent); }
.chart .last-t { fill: var(--ink); font: 500 12px var(--font-mono); }
.chart .cursor { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.readout { font-size: 13px; color: var(--muted); min-height: 1.45em; }
.readout b { color: var(--ink); font-weight: 600; }
.chart .eat { fill: var(--s-eat); }
.chart .eat.dim { opacity: 0.45; }
.chart .burn { fill: none; stroke: var(--s-burn); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .burn-pt { fill: var(--s-burn); stroke: var(--panel); stroke-width: 2; }
.chart .burn-pt.partial { fill: var(--panel); stroke: var(--s-burn); stroke-width: 2; }
.chart .sel-band { fill: var(--accent); opacity: 0.08; }
.chart .xl { fill: var(--muted); font: 10px var(--font-mono); }
.chart .xl.sel { fill: var(--ink); font-weight: 500; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw-bar { width: 10px; height: 10px; border-radius: 2px; background: var(--s-eat); }
.sw-line { width: 16px; height: 2px; border-radius: 1px; background: var(--s-burn); }

.targets td { padding: 4px; }
.targets input { padding: 6px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.targets td:first-child { white-space: normal; min-width: 92px; }

@media (max-width: 420px) {
  h1 { font-size: 23px; }
  .kcal-big { font-size: 28px; }
  .bar { grid-template-columns: 62px 1fr auto; gap: 8px; }
  .tile-v { font-size: 18px; }
  table { font-size: 12.5px; }
  .tile { padding: 7px 8px; }
  .set-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="top-row">
      <div>
        <h1 data-i18n="title">Food, weight &amp; burn</h1>
        <p class="sub" id="goalLine"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="progress">
      <div class="track" aria-hidden="true"><div class="fill ok" id="goalFill"></div></div>
      <p class="sub" id="goalText"></p>
      <p class="sub" id="paceNeed" hidden></p>
      <p class="sub" id="paceNow" hidden></p>
    </div>
    <p class="status" id="status" role="status"></p>
    <div class="onb" id="onb" hidden>
      <p data-i18n="onbText"></p>
      <div class="actions"><button class="btn small" type="button" id="onbBtn" data-i18n="onbBtn"></button></div>
    </div>
  </header>

  <section class="card" aria-labelledby="dayH">
    <div class="day-nav">
      <button class="icon" id="prevDay" type="button" data-i18n-aria="prevDay">‹</button>
      <h2 id="dayH"><span id="dayLabel">—</span></h2>
      <button class="icon" id="nextDay" type="button" data-i18n-aria="nextDay">›</button>
    </div>
    <div class="actions" id="todayWrap" hidden><button class="btn ghost small" id="todayBtn" type="button" data-i18n="backToday"></button></div>

    <div class="chips" id="typeChips" role="group" data-i18n-aria="dayType"></div>
    <p class="hint" id="typeHint"></p>

    <div class="kcal">
      <p><span class="kcal-big num" id="kcalEaten">0</span><span class="kcal-of"> / <span class="num" id="kcalTarget">—</span> <span data-i18n="kcal"></span></span></p>
      <p class="left" id="kcalLeft"></p>
    </div>
    <div class="burn" id="burnBox">
      <p class="burn-line"><span><span data-i18n="burn"></span> <b id="burnTotal">—</b></span><span><span data-i18n="balance"></span> <b id="burnBal">—</b></span></p>
      <p class="hint num" id="burnHint"></p>
      <div class="actions" id="corosAct" hidden><button class="btn ghost small" id="corosBtn" type="button" data-i18n="corosBtn"></button></div>
    </div>
    <div class="bars" id="bars"></div>

    <form class="weight" id="weightForm" autocomplete="off">
      <label for="weightInput" data-i18n="weightLbl"></label>
      <input id="weightInput" name="weight" inputmode="decimal" data-i18n-ph="weightPh">
      <button class="btn" type="submit" data-i18n="save"></button>
    </form>

    <div class="meals-wrap">
      <h3 data-i18n="foodH"></h3>
      <div class="meals" id="meals"></div>
    </div>

    <details id="mealDetails">
      <summary id="mealSummary"></summary>
      <form id="mealForm" class="meal-form" autocomplete="off">
        <div class="row2">
          <label class="field" for="mTitle"><span data-i18n="mealLbl"></span>
            <select id="mTitle" name="title"></select>
          </label>
          <label class="field" for="mTime"><span data-i18n="timeLbl"></span>
            <input id="mTime" name="time" type="time">
          </label>
        </div>
        <label class="field" for="mDesc"><span data-i18n="whatLbl"></span>
          <input id="mDesc" name="desc" data-i18n-ph="whatPh">
        </label>
        <div class="grid4">
          <label class="field" for="mKcal"><span data-i18n="kcalLbl"></span><input id="mKcal" name="kcal" inputmode="numeric" data-i18n-ph="autoPh"></label>
          <label class="field" for="mP"><span data-i18n="pLbl"></span><input id="mP" name="p" inputmode="decimal"></label>
          <label class="field" for="mF"><span data-i18n="fLbl"></span><input id="mF" name="f" inputmode="decimal"></label>
          <label class="field" for="mC"><span data-i18n="cLbl"></span><input id="mC" name="c" inputmode="decimal"></label>
        </div>
        <p class="hint" data-i18n="autoHint"></p>
        <div class="actions">
          <button class="btn" type="submit" id="mSave"></button>
          <button class="btn ghost" type="button" id="mCancel" data-i18n="cancel" hidden></button>
        </div>
      </form>
    </details>
    <p class="hint" id="dayHint"></p>
  </section>

  <section class="card" aria-labelledby="weekH">
    <h2 id="weekH" data-i18n="weekH"></h2>
    <div class="tiles">
      <div class="tile"><span class="tile-k" data-i18n="tAvgK"></span><span class="tile-v" id="tAvgK">—</span><span class="tile-s" id="tAvgKs"></span></div>
      <div class="tile"><span class="tile-k" data-i18n="tBal"></span><span class="tile-v" id="tBal">—</span><span class="tile-s" id="tBalS"></span></div>
      <div class="tile"><span class="tile-k" data-i18n="tAvgW"></span><span class="tile-v" id="tAvgW">—</span><span class="tile-s" id="tAvgWs"></span></div>
      <div class="tile"><span class="tile-k" data-i18n="tDelta"></span><span class="tile-v" id="tDelta">—</span><span class="tile-s" id="tDeltaS"></span></div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th data-i18n="thDay"></th><th data-i18n="thType"></th><th class="r" data-i18n="thKcal"></th><th class="r" data-i18n="thBal"></th><th class="r" data-i18n="thP"></th><th class="r" data-i18n="thW"></th></tr></thead>
        <tbody id="weekBody"></tbody>
      </table>
    </div>
    <p class="legend"><span><span class="dot ok"></span><span data-i18n="legOk"></span></span><span><span class="dot over"></span><span data-i18n="legOver"></span></span><span><span class="dot low"></span><span data-i18n="legLow"></span></span></p>
    <p class="hint" data-i18n="balHint"></p>
  </section>

  <section class="card" aria-labelledby="ebH">
    <h2 id="ebH" data-i18n="ebH"></h2>
    <p class="keys"><span class="key"><span class="sw-bar" aria-hidden="true"></span><span data-i18n="keyEat"></span></span><span class="key"><span class="sw-line" aria-hidden="true"></span><span data-i18n="keyBurn"></span></span></p>
    <p class="readout num" id="ebReadout"></p>
    <div class="chart" id="ebChart"></div>
    <details>
      <summary data-i18n="ebTable"></summary>
      <div class="scroll">
        <table>
          <thead><tr><th data-i18n="thDay"></th><th class="r" data-i18n="thEat"></th><th class="r" data-i18n="thBurn"></th><th class="r" data-i18n="thBal"></th></tr></thead>
          <tbody id="ebBody"></tbody>
        </table>
      </div>
    </details>
    <p class="hint" data-i18n="ebHint"></p>
  </section>

  <section class="card" aria-labelledby="wH">
    <h2 id="wH" data-i18n="wH"></h2>
    <p class="readout num" id="readout"></p>
    <div class="chart" id="chart"></div>
    <p class="hint" data-i18n="wHint"></p>
  </section>

  <section class="card" aria-labelledby="setH" id="settingsCard">
    <details id="settingsDetails">
      <summary id="setH" data-i18n="setH"></summary>
      <form id="settingsForm" autocomplete="off" class="meal-form">
        <div class="set-block">
          <h3 data-i18n="profH"></h3>
          <div class="set-grid">
            <label class="field" for="sSex"><span data-i18n="sexLbl"></span>
              <select id="sSex"><option value="male" data-i18n="male"></option><option value="female" data-i18n="female"></option></select>
            </label>
            <label class="field" for="sAge"><span data-i18n="ageLbl"></span><input id="sAge" inputmode="numeric"></label>
            <label class="field" for="sHeight"><span data-i18n="heightLbl"></span><input id="sHeight" inputmode="numeric"></label>
            <label class="field" for="sStart"><span data-i18n="startLbl"></span><input id="sStart" inputmode="decimal"></label>
            <label class="field" for="sGoal"><span data-i18n="goalLblW"></span><input id="sGoal" inputmode="decimal"></label>
            <label class="field" for="sCut"><span data-i18n="cutLbl"></span><select id="sCut"></select></label>
            <label class="field" for="sStartDate"><span data-i18n="startDateLbl"></span><input id="sStartDate" type="date"></label>
            <label class="field" for="sGoalDate"><span data-i18n="goalDateLbl"></span><input id="sGoalDate" type="date"></label>
            <label class="field wide" for="sNote"><span data-i18n="noteLbl"></span><input id="sNote" maxlength="80" data-i18n-ph="notePh"></label>
          </div>
          <p class="hint" data-i18n="dateHint"></p>
          <p class="hint" data-i18n="cutHint"></p>
        </div>
        <div class="set-block">
          <h3 data-i18n="burnH"></h3>
          <div class="set-grid">
            <label class="field" for="sK"><span data-i18n="kLbl"></span><input id="sK" inputmode="decimal" data-i18n-ph="autoPh"></label>
          </div>
          <p class="hint" id="kInfo"></p>
        </div>
        <div class="set-block">
          <h3 data-i18n="targH"></h3>
          <p class="hint" id="targSrc"></p>
          <div class="scroll">
            <table class="targets">
              <thead><tr><th data-i18n="thType"></th><th class="r" data-i18n="kcalLbl"></th><th class="r" data-i18n="thP"></th><th class="r" data-i18n="thF"></th><th class="r" data-i18n="thC"></th></tr></thead>
              <tbody id="targetsBody"></tbody>
            </table>
          </div>

  // ---------- intake vs burn chart ----------
  var EB_DAYS = 14;
  var ebFocus = null;
  function ebData() {
    var cal = calibration(), now = today(), rows = [];
    for (var i = EB_DAYS - 1; i >= 0; i--) {
      var date = addDays(now, -i), meals = mealsOn(date), b = burnOn(date, cal);
      rows.push({ date: date, eat: meals.length ? totals(meals).kcal : null, burn: b ? b.total : null, partial: date === now });
    }
    return rows;
  }
  function colPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h));
    return "M" + x.toFixed(1) + " " + (y + h).toFixed(1) +
      "V" + (y + r).toFixed(1) +
      "A" + r + " " + r + " 0 0 1 " + (x + r).toFixed(1) + " " + y.toFixed(1) +
      "H" + (x + w - r).toFixed(1) +
      "A" + r + " " + r + " 0 0 1 " + (x + w).toFixed(1) + " " + (y + r).toFixed(1) +
      "V" + (y + h).toFixed(1) + "Z";
  }
  function renderEB() {
    var box = $("#ebChart"), ro = $("#ebReadout"), rows = ebData();
    var body = $("#ebBody");
    body.textContent = "";
    rows.slice().reverse().forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "", F.row.format(parseIso(r.date))));
      tr.appendChild(el("td", "r num", r.eat !== null ? F.plain.format(Math.round(r.eat)) : "—"));
      tr.appendChild(el("td", "r num", r.burn !== null ? F.plain.format(Math.round(r.burn)) : "—"));
      var bal = r.eat !== null && r.burn !== null ? r.eat - r.burn : null;
      tr.appendChild(el("td", "r num" + (r.partial ? " partial" : ""), bal === null ? "—" : signedPlain(bal)));
      body.appendChild(tr);
    });

    var any = rows.some(function (r) { return r.eat !== null || r.burn !== null; });
    if (!any) {
      box.textContent = "";
      box.appendChild(el("p", "empty", t("ebEmpty")));
      ro.textContent = "";
      return;
    }
    var W = Math.max(280, Math.round(box.clientWidth || 600)), H = 220;
    var m = { l: 42, r: 8, t: 12, b: 24 };
    var max = 0;
    rows.forEach(function (r) { if (r.eat !== null) max = Math.max(max, r.eat); if (r.burn !== null) max = Math.max(max, r.burn); });
    var step = max <= 4000 ? 1000 : max <= 10000 ? 2000 : 5000;
    var yMax = Math.max(step, Math.ceil(max / step) * step);
    var plotW = W - m.l - m.r, plotH = H - m.t - m.b;
    var slot = plotW / rows.length;
    var bw = Math.min(24, Math.max(6, slot * 0.56));
    function cx(i) { return m.l + slot * (i + 0.5); }
    function sy(v) { return m.t + (1 - v / yMax) * plotH; }

    var g = "", selIdx = -1;
    rows.forEach(function (r, i) { if (r.date === state.selected) selIdx = i; });
    if (selIdx >= 0) g += '<rect class="sel-band" x="' + (m.l + slot * selIdx).toFixed(1) + '" y="' + m.t + '" width="' + slot.toFixed(1) + '" height="' + plotH + '" rx="4"/>';
    for (var y = 0; y <= yMax; y += step) {
      var yy = sy(y).toFixed(1);
      g += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '"/>';
      g += '<text class="axis" x="' + (m.l - 6) + '" y="' + (Number(yy) + 4).toFixed(1) + '" text-anchor="end">' + fmt(y) + '</text>';
    }
    rows.forEach(function (r, i) {
      if (r.eat === null || r.eat <= 0) return;
      var top = sy(r.eat);
      g += '<path class="eat' + (r.partial ? " dim" : "") + '" d="' + colPath(cx(i) - bw / 2, top, bw, sy(0) - top, 4) + '"/>';
    });
    var seg = "", segs = [];
    rows.forEach(function (r, i) {
      if (r.burn === null) { if (seg) segs.push(seg); seg = ""; return; }
      seg += (seg ? "L" : "M") + cx(i).toFixed(1) + " " + sy(r.burn).toFixed(1) + " ";
    });
    if (seg) segs.push(seg);
    segs.forEach(function (d) { g += '<path class="burn" d="' + d + '"/>'; });
    rows.forEach(function (r, i) {
      if (r.burn === null) return;
      g += '<circle class="burn-pt' + (r.partial ? " partial" : "") + '" cx="' + cx(i).toFixed(1) + '" cy="' + sy(r.burn).toFixed(1) + '" r="4"/>';
    });
    var every = slot >= 20 ? 1 : 2;
    rows.forEach(function (r, i) {
      if ((rows.length - 1 - i) % every) return;
      g += '<text class="xl' + (i === selIdx ? " sel" : "") + '" x="' + cx(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + parseIso(r.date).getDate() + '</text>';
    });
    g += '<line class="cursor" id="ebCursor" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + plotH) + '" visibility="hidden"/>';
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" tabindex="0" role="img">' + g + '</svg>';

    var svg = box.querySelector("svg"), cl = box.querySelector("#ebCursor");
    svg.setAttribute("aria-label", t("ebAria"));
    function show(i, cursor) {
      ebFocus = i;
      var r = rows[i];
      ro.textContent = "";
      ro.appendChild(document.createTextNode(cap(F.day.format(parseIso(r.date))) + ": " + t("ebEaten") + " "));
      ro.appendChild(el("b", "", r.eat !== null ? fmt(r.eat) : "—"));
      ro.appendChild(document.createTextNode(", " + t("ebBurn") + " "));
      ro.appendChild(el("b", "", r.burn !== null ? "≈ " + fmt(r.burn) : "—"));
      if (r.eat !== null && r.burn !== null) {
        ro.appendChild(document.createTextNode(", " + t("ebBal") + " "));
        ro.appendChild(el("b", "", signed(r.eat - r.burn) + " " + t("kcal")));
        if (r.partial) ro.appendChild(document.createTextNode(" " + t("ebRunning")));
      }
      if (cursor) {
        var x = cx(i).toFixed(1);
        cl.setAttribute("x1", x); cl.setAttribute("x2", x); cl.setAttribute("visibility", "visible");
      } else {
        cl.setAttribute("visibility", "hidden");
      }
    }
    var restIdx = selIdx >= 0 ? selIdx : rows.length - 1;
    show(restIdx, false);
    function idxAt(e) {
      var r = svg.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width * W;
      return Math.max(0, Math.min(rows.length - 1, Math.floor((px - m.l) / slot)));
    }
    svg.addEventListener("pointermove", function (e) { show(idxAt(e), true); });
    svg.addEventListener("pointerleave", function () { show(restIdx, false); });
    svg.addEventListener("click", function (e) {
      state.selected = rows[idxAt(e)].date;
      if (!state.editing) resetForm();
      renderAll();
    });
    svg.addEventListener("keydown", function (e) {
      var i = ebFocus === null ? restIdx : ebFocus;
      if (e.key === "ArrowLeft") { e.preventDefault(); show(Math.max(0, i - 1), true); }
      else if (e.key === "ArrowRight") { e.preventDefault(); show(Math.min(rows.length - 1, i + 1), true); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.selected = rows[i].date; renderAll(); }
    });
    svg.addEventListener("blur", function () { show(restIdx, false); });
  }

  // ---------- weight chart ----------
  function renderChart() {
    var box = $("#chart"), ws = weights(), s = settings();
    var ro = $("#readout");
    if (!ws.length) {
      box.textContent = "";
      box.appendChild(el("p", "empty", t("wEmpty")));
      ro.textContent = "";
      return;
    }
    var W = Math.max(280, Math.round(box.clientWidth || 600)), H = 210;
    var m = { l: 34, r: 16, t: 16, b: 26 };
    var ts = ws.map(function (x) { return parseIso(x.date).getTime(); });
    var x1 = ts[ts.length - 1];
    var x0 = Math.min(ts[0], x1 - 13 * DAY);
    var roll = ws.map(function (x, i) {
      var lo = ts[i] - 6 * DAY, sum = 0, n = 0;
      for (var j = 0; j <= i; j++) if (ts[j] >= lo) { sum += ws[j].w; n++; }
      return sum / n;
    });
    var vals = ws.map(function (x) { return x.w; });
    if (s.goalWeight !== null) vals.push(s.goalWeight);
    var pl = plan(), pa = null, pb = null;
    if (pl) {
      pa = Math.max(x0, pl.t0); pb = Math.min(x1, pl.t1);
      if (pb > pa) vals.push(pl.at(pa), pl.at(pb)); else pl = null;
    }
    var y0 = Math.floor(Math.min.apply(null, vals) - 0.5), y1 = Math.ceil(Math.max.apply(null, vals) + 0.5);
    function sx(tm) { return m.l + (tm - x0) / ((x1 - x0) || 1) * (W - m.l - m.r); }
    function sy(v) { return m.t + (y1 - v) / ((y1 - y0) || 1) * (H - m.t - m.b); }
    var step = (y1 - y0) > 10 ? 2 : 1;
    var g = "";
    for (var y = y0; y <= y1; y += step) {
      g += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + sy(y).toFixed(1) + '" y2="' + sy(y).toFixed(1) + '"/>';
      g += '<text class="axis" x="' + (m.l - 6) + '" y="' + (sy(y) + 4).toFixed(1) + '" text-anchor="end">' + y + '</text>';
    }
    if (s.goalWeight !== null) {
      var gy = sy(s.goalWeight).toFixed(1);
      g += '<line class="goal" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + gy + '" y2="' + gy + '"/>';
      g += '<text class="goal-t" x="' + (W - m.r) + '" y="' + (Number(gy) - 5) + '" text-anchor="end">' + t("goalShort") + ' ' + fmt1(s.goalWeight) + '</text>';
    }
    g += '<text class="axis" x="' + m.l + '" y="' + (H - 6) + '">' + F.day.format(new Date(x0)) + '</text>';
    g += '<text class="axis" x="' + (W - m.r) + '" y="' + (H - 6) + '" text-anchor="end">' + F.day.format(new Date(x1)) + '</text>';
    if (pl) g += '<line class="plan" x1="' + sx(pa).toFixed(1) + '" y1="' + sy(pl.at(pa)).toFixed(1) + '" x2="' + sx(pb).toFixed(1) + '" y2="' + sy(pl.at(pb)).toFixed(1) + '"/>';
    if (ws.length > 1) {
      var d = roll.map(function (v, i) { return (i ? "L" : "M") + sx(ts[i]).toFixed(1) + " " + sy(v).toFixed(1); }).join(" ");
      g += '<path class="avg" d="' + d + '"/>';
    }
    ws.forEach(function (x, i) {
      var last = i === ws.length - 1;
      g += '<circle class="pt' + (last ? " last" : "") + '" cx="' + sx(ts[i]).toFixed(1) + '" cy="' + sy(x.w).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '"/>';
    });
    var lx = sx(x1), ly = sy(ws[ws.length - 1].w);
    var below = roll[roll.length - 1] >= ws[ws.length - 1].w;
    g += '<text class="last-t" x="' + (lx - 8).toFixed(1) + '" y="' + (below ? ly + 18 : ly - 9).toFixed(1) + '" text-anchor="end">' + fmt1(ws[ws.length - 1].w) + '</text>';
    g += '<line class="cursor" id="cursorLine" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" visibility="hidden"/>';
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">' + g + '</svg>';
    var svg = box.querySelector("svg"), cl = box.querySelector("#cursorLine");
    svg.setAttribute("aria-label", t("wAria"));
    function show(i) {
      var txt = t("wReadout", { d: cap(F.day.format(parseIso(ws[i].date))), w: fmt1(ws[i].w), a: fmt1(roll[i]) });
      if (pl && ts[i] >= pl.t0 && ts[i] <= pl.t1) txt += ", " + t("planShort", { p: fmt1(pl.at(ts[i])) });
      ro.textContent = txt;
    }
    show(ws.length - 1);
    function move(e) {
      var r = svg.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width * W;
      var best = 0, bd = Infinity;
      ts.forEach(function (tm, i) { var dd = Math.abs(sx(tm) - px); if (dd < bd) { bd = dd; best = i; } });
      var cx = sx(ts[best]).toFixed(1);
      cl.setAttribute("x1", cx); cl.setAttribute("x2", cx); cl.setAttribute("visibility", "visible");
      show(best);
    }
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", function () { cl.setAttribute("visibility", "hidden"); show(ws.length - 1); });
  }

    state.editing = id;
    fillTitles();
    var sel = $("#mTitle"), k = keyOf(MEAL_TEXT, d.title);
    if (!k && d.title) { var o = el("option", "", String(d.title)); o.value = String(d.title); sel.appendChild(o); }
    sel.value = k || d.title || guessTitle();
    $("#mTime").value = d.time || "";
    $("#mDesc").value = d.desc || "";
    $("#mKcal").value = finite(d.kcal) ? String(Math.round(d.kcal)) : "";
    $("#mP").value = finite(d.p) ? String(d.p) : "";
    $("#mF").value = finite(d.f) ? String(d.f) : "";
    $("#mC").value = finite(d.c) ? String(d.c) : "";
    $("#mSave").textContent = t("saveChanges");
    $("#mCancel").hidden = false;
    $("#mealSummary").textContent = t("editEntry");
    $("#mealDetails").open = true;
    $("#mDesc").focus();
  }
  function submitMeal(e) {
    e.preventDefault();
    if (!requireDb()) return;
    var p = num($("#mP").value), f = num($("#mF").value), c = num($("#mC").value), kcal = num($("#mKcal").value);
    var desc = $("#mDesc").value.trim();
    var hasMacros = isFinite(p) || isFinite(f) || isFinite(c);
    if (!isFinite(kcal) && hasMacros) kcal = 4 * (isFinite(p) ? p : 0) + 9 * (isFinite(f) ? f : 0) + 4 * (isFinite(c) ? c : 0);
    if (!isFinite(kcal)) { setStatus(t("needKcal"), "warn"); return; }
    var existing = state.editing ? state.docs.get(state.editing) : null;
    var data = existing ? clone(existing) : {};
    data.kind = "meal";
    data.date = existing && isDate(existing.date) ? existing.date : state.selected;
    data.title = $("#mTitle").value;
    data.time = $("#mTime").value || "";
    data.desc = desc;
    data.kcal = Math.round(kcal);
    ["p", "f", "c"].forEach(function (k) { var v = ({ p: p, f: f, c: c })[k]; if (isFinite(v)) data[k] = Math.round(v); else delete data[k]; });
    if (!existing) { data.src = "manual"; data.createdAt = Date.now(); }
    var id = state.editing || ("meal-" + data.date.replace(/-/g, "") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    var btn = $("#mSave");
    btn.disabled = true;
    write(id, function (ref) { return ref.set(data); }).then(function () {
      setStatus("");
      resetForm();
      $("#mealDetails").open = false;
    }, function () {}).then(function () { btn.disabled = false; });
  }

  function readTargets() {
    var targets = {}, bad = false;
    TYPES.forEach(function (k) {
      targets[k] = {};
      ["kcal", "p", "f", "c"].forEach(function (f) {
        var v = num($("#t-" + k + "-" + f).value);
        if (!isFinite(v) || v < 0) bad = true;
        targets[k][f] = Math.round(v);
      });
    });
    return bad ? null : targets;
  }
  function submitSettings(e, resetTargets) {
    if (e) e.preventDefault();
    if (!requireDb()) return;
    var age = num($("#sAge").value), height = num($("#sHeight").value);
    var sw = num($("#sStart").value), gw = num($("#sGoal").value);
    var okW = function (v) { return isNaN(v) || (v >= 30 && v <= 250); };
    if ((!isNaN(age) && (age < 14 || age > 100)) || (!isNaN(height) && (height < 120 || height > 230)) || !okW(sw) || !okW(gw)) {
      setStatus(t("profBad"), "warn"); return;
    }
    var startDate = $("#sStartDate").value, goalDate = $("#sGoalDate").value;
    if (startDate && !isDate(startDate)) startDate = "";
    if (goalDate && !isDate(goalDate)) goalDate = "";
    if (startDate && goalDate && goalDate <= startDate) { setStatus(t("dateBad"), "warn"); return; }
    var kRaw = $("#sK").value.trim(), k = num(kRaw);
    if (kRaw !== "" && (!isFinite(k) || k < 0.3 || k > 1.5)) { setStatus(t("kBad"), "warn"); return; }
    var targets = null;
    if (!resetTargets) {
      targets = readTargets();
      if (!targets) { setStatus(t("setBad"), "warn"); return; }
    }
    var before = settings();
    write("settings", function (ref) {
      var data = clone(state.docs.get("settings"));
      data.lang = state.lang;
      data.sex = $("#sSex").value === "female" ? "female" : "male";
      if (isNaN(age)) delete data.age; else data.age = Math.round(age);
      if (isNaN(height)) delete data.height; else data.height = Math.round(height);
      if (isNaN(sw)) delete data.startWeight; else data.startWeight = Math.round(sw * 10) / 10;
      if (isNaN(gw)) delete data.goalWeight; else data.goalWeight = Math.round(gw * 10) / 10;
      var note = $("#sNote").value.trim().slice(0, 80);
      if (note) data.goalNote = note; else delete data.goalNote;
      if (startDate) data.startDate = startDate; else delete data.startDate;
      if (goalDate) data.goalDate = goalDate; else delete data.goalDate;
      data.dayCutoff = Number($("#sCut").value);
      if (kRaw === "") delete data.burnK; else data.burnK = Math.round(k * 100) / 100;
      if (resetTargets) {
        delete data.targets;
      } else {
        // Keep only targets that differ from the suggested ones, so suggestions follow weight changes.
        var sug = suggestedTargets(), keep = {};
        TYPES.forEach(function (tp) {
          var a = targets[tp], b = sug[tp];
          var wasCustom = before.customTargets && data.targets && data.targets[tp];
          if (wasCustom || a.kcal !== b.kcal || a.p !== b.p || a.f !== b.f || a.c !== b.c) keep[tp] = a;
        });
        if (Object.keys(keep).length) data.targets = keep; else delete data.targets;
      }
      return ref.set(data);
    }).then(function () {
      state.settingsDirty = false;
      setStatus(t("setSaved"));
      renderAll();
    }, function () {});
  }

  // ---------- COROS ----------
  // queryDailyHealthData answers in text: "--- 20261107 ---\nSteps: … | Calories: 7,704 kcal | …".
  // Its "Calories" is active energy only (base metabolism is added here).
  function corosText(result) {
    var p = result ? result.payload : null, tx = typeof p === "string" ? p : null;
    if (tx === null && result && Array.isArray(result.content)) {
      for (var i = 0; i < result.content.length; i++) {
        var c = result.content[i];
        if (c && c.type === "text" && typeof c.text === "string") { tx = c.text; break; }
      }
    }
    if (tx === null && p && typeof p === "object") { try { tx = JSON.stringify(p); } catch (e) { tx = ""; } }
    if (typeof tx === "string" && tx.charAt(0) === '"') { try { var u = JSON.parse(tx); if (typeof u === "string") tx = u; } catch (e) {} }
    return tx || "";
  }
  function parseCoros(text) {
    var out = new Map(), re = /---\s*(\d{4})(\d{2})(\d{2})\s*---([\s\S]*?)(?=---\s*\d{8}\s*---|$)/g, m;
    while ((m = re.exec(text))) {
      var cm = /Calories:\s*(\d[\d,\s]*)\s*kcal/i.exec(m[4]);
      if (!cm) continue;
      var v = Number(cm[1].replace(/[,\s]/g, ""));
      if (isFinite(v)) out.set(m[1] + "-" + m[2] + "-" + m[3], v);
    }
    return out;
  }
  var COROS_MSG = {
    needs_reauth: "cNeedsReauth", server_not_connected: "cNotConnected", selection_required: "cSelect",
    approval_required: "cApproval", consent_required: "cApproval", not_in_manifest: "cOff", blocked_by_policy: "cPolicy",
    not_granted: "cUnavailable", capability_disabled: "cUnavailable", capability_removed: "cUnavailable",
    server_unavailable: "cDown", rate_limited: "cDown", upstream_error: "cDown"
  };
  function corosMsg() {
    var e = state.corosErr;
    if (!e) return "";
    if (e.code === "tool_error") return t("cToolErr", { m: String(e.message || "").slice(0, 120) });
    if (e.code === "parse") return t("cParse");
    return t(COROS_MSG[e.code] || "cFail");
  }
  function onCorosData(result) {
    var mp = parseCoros(corosText(result));
    if (!mp.size) { state.corosErr = { code: "parse" }; renderAll(); return; }
    state.coros = mp;
    state.corosAt = result && result.cache && finite(result.cache.storedAt) ? result.cache.storedAt : Date.now();
    state.corosErr = null;
    state.corosAsk = false;
    syncActive();
    renderAll();
  }
  function onCorosError(err) {
    var code = err && err.code;
    var denied = ["needs_reauth", "server_not_connected", "selection_required", "blocked_by_policy", "approval_required", "not_in_manifest", "consent_required"];
    if (denied.indexOf(code) >= 0) { state.coros = new Map(); state.corosAt = null; }
    state.corosErr = { code: code, message: err && err.message };
    state.corosAsk = code === "approval_required" || code === "consent_required";
    renderAll();
  }
  // Keep a copy of each day's active calories in the store, so history outlives the 14-day window.
  function syncActive() {
    if (!state.loaded || !state.col || !state.coros.size) return;
    state.coros.forEach(function (v, date) {
      var val = Math.round(v), d = dayDoc(date);
      if (d && finite(d.active) && Math.round(d.active) === val) { state.syncing.delete(date); return; }
      if (state.syncing.get(date) === val) return;
      state.syncing.set(date, val);
      write("day-" + date, function (ref) {
        var data = clone(dayDoc(date));
        data.kind = "day"; data.date = date; data.active = val; data.activeAt = Date.now();
        return ref.set(data);
      }).catch(function () { state.syncing.delete(date); });
    });
  }
  async function connectCoros() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    var mcp = null;
    try { mcp = await window.claude.use("mcp"); } catch (e) { mcp = null; }
    if (!mcp) { state.corosErr = { code: "not_granted" }; renderAll(); return; }
    state.mcp = mcp;
    try {
      mcp.watchTool(COROS, COROS_TOOL, COROS_INPUT, function (ev) {
        if (ev.type === "data") onCorosData(ev.result); else onCorosError(ev.error);
      }, { cache: COROS_CACHE, refetchInterval: 20 * 60 * 1000 });
    } catch (e) {
      onCorosError({ code: "bad_request" });
    }
  }
  function askCoros() {
    if (!state.mcp) return;
    var btn = $("#corosBtn");
    btn.disabled = true;
    state.mcp.callTool(COROS, COROS_TOOL, COROS_INPUT, { cache: COROS_CACHE })
      .then(onCorosData, onCorosError)
      .then(function () { btn.disabled = false; });
  }

  // ---------- language ----------
  function setLang(lang, persist) {
    if (lang !== "en" && lang !== "ru") return;
    var changed = state.lang !== lang;
    state.lang = lang;
    try { window.localStorage.setItem("nutrition-log-lang", lang); } catch (e) {}
    if (changed) {
      buildFormats();
      applyStatic();
      if (!state.editing) resetForm();
      renderAll();
    }
    if (persist) saveLang(lang);
  }

  // ---------- wiring ----------
  function wire() {
    applyStatic();
    resetForm();
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang"), true); });
    });
    $("#corosBtn").addEventListener("click", askCoros);
    $("#onbBtn").addEventListener("click", function () {
      $("#settingsDetails").open = true;
      $("#settingsCard").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    $("#prevDay").addEventListener("click", function () { state.selected = addDays(state.selected, -1); if (!state.editing) resetForm(); renderAll(); });
    $("#nextDay").addEventListener("click", function () { state.selected = addDays(state.selected, 1); if (!state.editing) resetForm(); renderAll(); });
    $("#todayBtn").addEventListener("click", function () { state.selected = today(); if (!state.editing) resetForm(); renderAll(); });
    $("#weightForm").addEventListener("submit", function (e) { e.preventDefault(); saveWeight($("#weightInput").value); });
    $("#mealForm").addEventListener("submit", submitMeal);
    $("#mCancel").addEventListener("click", function () { resetForm(); $("#mealDetails").open = false; });
    $("#settingsForm").addEventListener("submit", function (e) { submitSettings(e, false); });
    $("#resetTargets").addEventListener("click", function () { submitSettings(null, true); });
    $("#settingsForm").addEventListener("input", function () { state.settingsDirty = true; });
    if (window.ResizeObserver) {
      var lastW = 0;
      new ResizeObserver(function (entries) {
        var w = Math.round(entries[0].contentRect.width);
        if (w && Math.abs(w - lastW) > 4) { lastW = w; renderChart(); renderEB(); }
      }).observe($("#chart"));
    }
  }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") {
      setStatus(t("stNoClaude"), "bad");
      return;
    }
    var db = null, user = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    try { user = await window.claude.use("user"); } catch (e) { user = null; }
    if (!db) { setStatus(t("stNoDb"), "bad"); return; }
    var uid = null;
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    if (!uid) { setStatus(t("stSignIn"), "bad"); return; }
    state.col = db.collection("data/users/" + uid);
    setStatus(t("stLoading"));
    var timer = setTimeout(function () {
      if (!state.loaded) setStatus(t("stSlow"), "warn");
    }, 10000);
    state.col.onSnapshot(function (snap) {
      var mp = new Map();
      snap.docs.forEach(function (d) { var v = d.data(); if (v && typeof v === "object") mp.set(d.id, v); });
      state.docs = mp;
      var first = false;
      if (!snap.metadata || !snap.metadata.fromCache) {
        if (!state.loaded) { setStatus(""); first = true; }
        state.loaded = true;
        clearTimeout(timer);
        syncActive();
      }
      var lang = rawSettings().lang;
      if (first && (lang === "en" || lang === "ru") && lang !== state.lang) setLang(lang, false);
      if (first && !profileComplete()) $("#settingsDetails").open = true;
      renderAll();
    }, function (err) {
      clearTimeout(timer);
      setStatus(err && err.code === "revoked" ? t("stRevoked") : t("stLoadFail"), "bad");
    });
  }

  state.selected = today();
  buildFormats();
  wire();
  renderAll();
  connect();
  connectCoros();
})();
</script>
</body>
</html>
