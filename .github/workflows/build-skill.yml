name: Build skill

# Packs the skill ZIP from index.html and skill/ and publishes it as the latest release,
# so the download link in the README always matches the code on main.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - "skill/**"
      - scripts/build-skill.sh
      - .github/workflows/build-skill.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-skill
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ZIP
        run: sh scripts/build-skill.sh
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete skill-latest --cleanup-tag --yes || true
          gh release create skill-latest coros-nutrition-log.zip \
            --target "$GITHUB_SHA" \
            --title "Skill: latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Upload coros-nutrition-log.zip in Claude: Customize → Skills → + → Create skill → Upload a skill." \
            --latest
